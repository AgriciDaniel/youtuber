<rect x="855" y="285" width="180" height="74" fill="#ece7f3" stroke="#8d6bb3" stroke-width="3"/><text x="888" y="330" fill="#172033">Reports</text>
</g>
<path d="M300 322 H365 M545 322 H610 M790 322 H855" stroke="#64748b" stroke-width="4"/>
