<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">YouTube Brain frontispiece</title>
<desc id="desc">Editorial visual showing a source-cited brain product pipeline.</desc>
<rect width="1200" height="520" fill="#f6f4ef"/>
<rect x="70" y="70" width="1060" height="380" fill="#ffffff" stroke="#172033" stroke-width="3"/>
<text x="110" y="150" font-family="Inter,Arial" font-size="54" font-weight="800" fill="#172033">YouTube Brain</text>
<text x="112" y="205" font-family="Inter,Arial" font-size="22" fill="#334155">Source-cited Obsidian operating brain for YouTube creator growth and strategy: the recommendation system and discovery, audience retention and average view duration, packaging (titles, thumbnails, click-through rate), Shorts versus long-form, publishing cadence, monetization (YouTube Partner Program and RPM), analytics interpretation, and community..</text>
